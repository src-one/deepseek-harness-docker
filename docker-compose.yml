name: dsh-harness

networks:
  default:
    name: dsh-harness_default
    ipam: {}
    external: false

services:
  dsh:
    command: null
    container_name: dsh-harness
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "2.00"
        reservations:
          memory: 512MB
          cpus: "0.25"
      placement: {}
    entrypoint: null
    environment:
      # Model & API keys
      OPENAI_API_KEY: ollama-local-dummy
      # DEEPSEEK_API_KEY: your_deepseek_api_key_here
      # Optional: Basic Auth for Proxy
      # PROXY_USERNAME: admin
      # PROXY_PASSWORD: secretpassword
      # Workspace directory
      DSH_WORKSPACE: /workspace/Documents
    image: ghcr.io/src-one/deepseek-harness:latest
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/deepseek.png
    networks:
      - default
    ports:
      - mode: ingress
        target: 3080
        published: "3080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/dsh-harness
        target: /root/.dsh
      - type: bind
        source: /DATA/Documents
        target: /workspace/Documents
      - type: bind
        source: /DATA/Downloads
        target: /workspace/Downloads
      - type: bind
        source: /DATA/Media
        target: /workspace/Media
      - type: bind
        source: /DATA/Gallery
        target: /workspace/Gallery
      - type: bind
        source: /media/ZimaOS-HD
        target: /zimaos

